name: CI

on:
  push:
    branches: [main]
  pull_request:

# The default GITHUB_TOKEN permissions are repository-wide and often include
# write access to contents. Nothing in this workflow publishes anything, so
# drop it to read-only: a postinstall script from a compromised transitive
# dependency running during `bun install` would otherwise hold a writable token.
permissions:
  contents: read

# Superseded runs on the same ref are wasted minutes; cancel them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # sqlite-vec is a no-op on Linux's bundled SQLite (the macOS-only
    # Database.setCustomSQLite path in packages/db only fires on darwin),
    # so a stock ubuntu runner is sufficient — no extra system packages.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    # The whole pipeline runs in well under a minute; without a cap a hung
    # step burns the 6-hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Bun 1.4 respects the checked-in isolated workspace linker. Bun 1.2
          # installed duplicate Drizzle copies, which made private SQL types
          # incompatible across the server and database workspaces.
          bun-version: "1.4.2"

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bun run build

      - name: Initialize test database
        run: |
          docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d postgres <<'SQL'
          CREATE SCHEMA IF NOT EXISTS extensions;
          CREATE EXTENSION IF NOT EXISTS vector WITH SCHEMA extensions;
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE TABLE IF NOT EXISTS auth.users (
            id uuid PRIMARY KEY,
            aud text NOT NULL,
            role text NOT NULL,
            email text NOT NULL,
            encrypted_password text NOT NULL,
            email_confirmed_at timestamptz,
            raw_app_meta_data jsonb NOT NULL DEFAULT '{}',
            raw_user_meta_data jsonb NOT NULL DEFAULT '{}'
          );
          SQL

      - run: bun run test
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
