name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # sqlite-vec is a no-op on Linux's bundled SQLite (the macOS-only
    # Database.setCustomSQLite path in packages/db only fires on darwin),
    # so a stock ubuntu runner is sufficient — no extra system packages.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pin to the same minor as the production image (Dockerfile:
          # oven/bun:1.2-debian). `latest` let CI green-light code against a
          # Bun version production never runs — and a new Bun release could
          # break CI with no code change.
          bun-version: "1.2"

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bun run build

      - run: bun run test
