name: CI

on:
  push:
    branches: [main]
  pull_request:

# The default GITHUB_TOKEN permissions are repository-wide and often include
# write access to contents. Nothing in this workflow publishes anything, so
# drop it to read-only: a postinstall script from a compromised transitive
# dependency running during `bun install` would otherwise hold a writable token.
permissions:
  contents: read

# Superseded runs on the same ref are wasted minutes; cancel them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # sqlite-vec is a no-op on Linux's bundled SQLite (the macOS-only
    # Database.setCustomSQLite path in packages/db only fires on darwin),
    # so a stock ubuntu runner is sufficient — no extra system packages.
    runs-on: ubuntu-latest
    # The whole pipeline runs in well under a minute; without a cap a hung
    # step burns the 6-hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Bun 1.4 respects the checked-in isolated workspace linker. Bun 1.2
          # installed duplicate Drizzle copies, which made private SQL types
          # incompatible across the server and database workspaces.
          bun-version: "1.4.2"

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bun run build

      - run: bun run test
