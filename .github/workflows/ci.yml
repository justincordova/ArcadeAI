name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # sqlite-vec is a no-op on Linux's bundled SQLite (the macOS-only
    # Database.setCustomSQLite path in packages/db only fires on darwin),
    # so a stock ubuntu runner is sufficient — no extra system packages.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bun run build

      - run: bun run test
