# fly.toml app configuration file generated for arcadeai on 2026-05-12T13:27:58Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'arcadeai'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

# src/index.ts drains in-flight SSE streams for up to 30s on SIGINT before
# closing. Fly's default kill_timeout is 5s, so the process was killed one
# sixth of the way through that drain — stranding usage_log rows mid-stream
# (the server now reconciles those on boot, but not losing them is better).
kill_timeout = '35s'

[env]
  DATABASE_PATH = '/data/arcadeai.db'
  NODE_ENV = 'production'
  PORT = '3000'
  # Fly runs the app behind its load balancer, so X-Forwarded-For is set
  # reliably. Required for the IP-based rate limiter to see real client IPs
  # instead of the proxy address (which collapses all clients into one bucket).
  TRUST_PROXY = 'true'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
