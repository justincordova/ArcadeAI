<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Match Three</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #1d1830; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  canvas { background: #1d1830; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="game" width="640" height="700"></canvas>
<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;

  const STATE = { TITLE: 0, PLAY: 1, OVER: 2 };
  const COLS = 8;
  const ROWS = 8;
  const TILE = 64;
  const BOARD_X = (W - COLS * TILE) / 2;
  const BOARD_Y = 80;
  const COLORS = ["#ff5d6c", "#ffae3b", "#ffe83b", "#3bff7a", "#3bd6ff", "#a23bff"];
  const TARGET = 1500;
  const TIME_LIMIT = 90;

  const keys = Object.create(null);
  let prevKeys = Object.create(null);
  let state = STATE.TITLE;
  let board, score, timeLeft, selected, hoverCol, hoverRow, animTime;
  let lastTime = 0;

  function init() {
    board = [];
    for (let r = 0; r < ROWS; r++) {
      const row = [];
      for (let c = 0; c < COLS; c++) row.push(Math.floor(Math.random() * COLORS.length));
      board.push(row);
    }
    // Resolve any initial matches
    while (resolveMatches()) {}
    score = 0;
    timeLeft = TIME_LIMIT;
    selected = null;
    hoverCol = -1;
    hoverRow = -1;
    animTime = 0;
  }

  function findMatches() {
    const marks = [];
    for (let r = 0; r < ROWS; r++) marks.push(new Array(COLS).fill(false));
    // Horizontal
    for (let r = 0; r < ROWS; r++) {
      let runStart = 0;
      for (let c = 1; c <= COLS; c++) {
        if (c === COLS || board[r][c] !== board[r][runStart]) {
          if (c - runStart >= 3 && board[r][runStart] !== -1) {
            for (let k = runStart; k < c; k++) marks[r][k] = true;
          }
          runStart = c;
        }
      }
    }
    // Vertical
    for (let c = 0; c < COLS; c++) {
      let runStart = 0;
      for (let r = 1; r <= ROWS; r++) {
        if (r === ROWS || board[r][c] !== board[runStart][c]) {
          if (r - runStart >= 3 && board[runStart][c] !== -1) {
            for (let k = runStart; k < r; k++) marks[k][c] = true;
          }
          runStart = r;
        }
      }
    }
    return marks;
  }

  function resolveMatches() {
    const marks = findMatches();
    let cleared = 0;
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      if (marks[r][c]) { board[r][c] = -1; cleared++; }
    }
    if (cleared === 0) return false;
    score += cleared * 20;
    // Gravity
    for (let c = 0; c < COLS; c++) {
      let writeRow = ROWS - 1;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (board[r][c] !== -1) {
          board[writeRow][c] = board[r][c];
          if (writeRow !== r) board[r][c] = -1;
          writeRow--;
        }
      }
      for (let r = writeRow; r >= 0; r--) {
        board[r][c] = Math.floor(Math.random() * COLORS.length);
      }
    }
    return true;
  }

  function trySwap(r1, c1, r2, c2) {
    if (Math.abs(r1 - r2) + Math.abs(c1 - c2) !== 1) return false;
    [board[r1][c1], board[r2][c2]] = [board[r2][c2], board[r1][c1]];
    const marks = findMatches();
    let any = false;
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (marks[r][c]) any = true;
    if (!any) {
      [board[r1][c1], board[r2][c2]] = [board[r2][c2], board[r1][c1]];
      return false;
    }
    while (resolveMatches()) {}
    return true;
  }

  function pressed(k) { return !!keys[k] && !prevKeys[k]; }

  function update(dt) {
    if (state === STATE.TITLE) {
      if (pressed(" ") || pressed("enter")) { init(); state = STATE.PLAY; }
      return;
    }
    if (state === STATE.OVER) {
      if (pressed(" ") || pressed("enter")) { init(); state = STATE.PLAY; }
      return;
    }

    animTime += dt;
    timeLeft -= dt;
    if (timeLeft <= 0) { timeLeft = 0; state = STATE.OVER; return; }
    if (score >= TARGET) { state = STATE.OVER; return; }

    if (selected) {
      // Allow keyboard moves on the selected tile
      let dr = 0, dc = 0;
      if (pressed("arrowup") || pressed("w")) dr = -1;
      else if (pressed("arrowdown") || pressed("s")) dr = 1;
      else if (pressed("arrowleft") || pressed("a")) dc = -1;
      else if (pressed("arrowright") || pressed("d")) dc = 1;
      if (dr !== 0 || dc !== 0) {
        const nr = selected.r + dr;
        const nc = selected.c + dc;
        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
          if (trySwap(selected.r, selected.c, nr, nc)) selected = null;
          else selected = { r: nr, c: nc };
        }
      }
      if (pressed("escape")) selected = null;
    }
  }

  function render() {
    ctx.fillStyle = "#1d1830";
    ctx.fillRect(0, 0, W, H);

    if (state === STATE.TITLE) {
      ctx.textAlign = "center";
      ctx.fillStyle = "#fff";
      ctx.font = "bold 50px sans-serif";
      ctx.fillText("MATCH 3", W / 2, H / 2 - 30);
      ctx.fillStyle = "#aab";
      ctx.font = "18px sans-serif";
      ctx.fillText("Click two adjacent gems to swap", W / 2, H / 2);
      ctx.fillText("Reach " + TARGET + " points in " + TIME_LIMIT + "s", W / 2, H / 2 + 26);
      ctx.fillStyle = "#fff";
      ctx.fillText("Press SPACE to start", W / 2, H / 2 + 60);
      return;
    }

    // Board background
    ctx.fillStyle = "#100a1c";
    ctx.fillRect(BOARD_X - 10, BOARD_Y - 10, COLS * TILE + 20, ROWS * TILE + 20);

    // Tiles
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const v = board[r][c];
        if (v < 0) continue;
        const x = BOARD_X + c * TILE;
        const y = BOARD_Y + r * TILE;
        ctx.fillStyle = COLORS[v];
        ctx.beginPath();
        ctx.arc(x + TILE / 2, y + TILE / 2, TILE / 2 - 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,0.25)";
        ctx.beginPath();
        ctx.arc(x + TILE / 2 - 8, y + TILE / 2 - 8, 6, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    if (selected) {
      const x = BOARD_X + selected.c * TILE;
      const y = BOARD_Y + selected.r * TILE;
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 3;
      ctx.strokeRect(x + 2, y + 2, TILE - 4, TILE - 4);
    }
    if (hoverCol >= 0 && hoverRow >= 0 && (!selected || selected.r !== hoverRow || selected.c !== hoverCol)) {
      const x = BOARD_X + hoverCol * TILE;
      const y = BOARD_Y + hoverRow * TILE;
      ctx.strokeStyle = "rgba(255,255,255,0.4)";
      ctx.lineWidth = 2;
      ctx.strokeRect(x + 4, y + 4, TILE - 8, TILE - 8);
    }

    // HUD
    ctx.textAlign = "left";
    ctx.fillStyle = "#fff";
    ctx.font = "bold 22px sans-serif";
    ctx.fillText("Score " + score + " / " + TARGET, 18, 38);
    ctx.textAlign = "right";
    ctx.fillStyle = timeLeft < 10 ? "#ff5d6c" : "#fff";
    ctx.fillText("Time " + timeLeft.toFixed(1), W - 18, 38);

    if (state === STATE.OVER) {
      ctx.fillStyle = "rgba(0,0,0,0.7)";
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = "center";
      ctx.fillStyle = "#fff";
      ctx.font = "bold 48px sans-serif";
      ctx.fillText(score >= TARGET ? "YOU WIN" : "TIME UP", W / 2, H / 2 - 10);
      ctx.font = "20px sans-serif";
      ctx.fillStyle = "#aab";
      ctx.fillText("Score " + score + " — SPACE to retry", W / 2, H / 2 + 30);
    }
  }

  function pickCell(mx, my) {
    if (mx < BOARD_X || my < BOARD_Y) return null;
    const c = Math.floor((mx - BOARD_X) / TILE);
    const r = Math.floor((my - BOARD_Y) / TILE);
    if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return null;
    return { r, c };
  }

  function onClick(e) {
    if (state !== STATE.PLAY) return;
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
    const my = (e.clientY - rect.top) * (canvas.height / rect.height);
    const cell = pickCell(mx, my);
    if (!cell) return;
    if (!selected) { selected = cell; return; }
    if (selected.r === cell.r && selected.c === cell.c) { selected = null; return; }
    if (trySwap(selected.r, selected.c, cell.r, cell.c)) selected = null;
    else selected = cell;
  }

  function onMove(e) {
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
    const my = (e.clientY - rect.top) * (canvas.height / rect.height);
    const cell = pickCell(mx, my);
    hoverCol = cell ? cell.c : -1;
    hoverRow = cell ? cell.r : -1;
  }

  function gameLoop(t) {
    try {
      const dt = Math.min((t - lastTime) / 1000, 0.05);
      lastTime = t;
      update(dt);
      prevKeys = Object.assign(Object.create(null), keys);
      render();
      requestAnimationFrame(gameLoop);
    } catch (err) {
      try { parent.postMessage({ type: "game-error", message: err && err.message || String(err), stack: err && err.stack }, "*"); } catch (_) {}
    }
  }

  window.addEventListener("keydown", (e) => { keys[e.key.toLowerCase()] = true; });
  window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });
  canvas.addEventListener("click", onClick);
  canvas.addEventListener("mousemove", onMove);

  init();
  requestAnimationFrame((t) => { lastTime = t; gameLoop(t); });
})();
</script>
</body>
</html>
