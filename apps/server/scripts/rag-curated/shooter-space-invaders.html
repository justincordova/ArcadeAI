<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Invaders</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  canvas { background: #000; display: block; }
</style>
</head>
<body>
<canvas id="game" width="700" height="700"></canvas>
<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;

  const STATE = { TITLE: 0, PLAY: 1, OVER: 2 };
  const PLAYER_W = 44;
  const PLAYER_H = 18;
  const PLAYER_Y = H - 60;
  const PLAYER_SPEED = 360;
  const BULLET_SPEED = 540;
  const ALIEN_W = 36;
  const ALIEN_H = 26;
  const ALIEN_GAP_X = 18;
  const ALIEN_GAP_Y = 14;
  const ALIEN_ROWS = 4;
  const ALIEN_COLS = 9;

  const keys = Object.create(null);
  let prevKeys = Object.create(null);
  let state = STATE.TITLE;
  let player, bullets, aliens, alienBullets, score, lives, wave, alienDir, alienStepTimer, stepInterval, fireCooldown;
  let lastTime = 0;

  function init() {
    player = { x: W / 2 - PLAYER_W / 2, y: PLAYER_Y };
    bullets = [];
    alienBullets = [];
    score = 0;
    lives = 3;
    wave = 1;
    fireCooldown = 0;
    spawnWave();
  }

  function spawnWave() {
    aliens = [];
    const totalW = ALIEN_COLS * ALIEN_W + (ALIEN_COLS - 1) * ALIEN_GAP_X;
    const startX = (W - totalW) / 2;
    const startY = 70;
    for (let r = 0; r < ALIEN_ROWS; r++) {
      for (let c = 0; c < ALIEN_COLS; c++) {
        aliens.push({
          x: startX + c * (ALIEN_W + ALIEN_GAP_X),
          y: startY + r * (ALIEN_H + ALIEN_GAP_Y),
          w: ALIEN_W,
          h: ALIEN_H,
          alive: true,
          row: r,
        });
      }
    }
    alienDir = 1;
    alienStepTimer = 0;
    stepInterval = Math.max(0.18, 0.7 - (wave - 1) * 0.1);
  }

  function pressed(k) { return !!keys[k] && !prevKeys[k]; }

  function update(dt) {
    if (state === STATE.TITLE) {
      if (pressed(" ") || pressed("enter")) { init(); state = STATE.PLAY; }
      return;
    }
    if (state === STATE.OVER) {
      if (pressed(" ") || pressed("enter")) { init(); state = STATE.PLAY; }
      return;
    }

    if (keys["arrowleft"] || keys["a"]) player.x -= PLAYER_SPEED * dt;
    if (keys["arrowright"] || keys["d"]) player.x += PLAYER_SPEED * dt;
    player.x = Math.max(0, Math.min(W - PLAYER_W, player.x));

    fireCooldown -= dt;
    if ((keys[" "] || keys["arrowup"] || keys["w"]) && fireCooldown <= 0) {
      bullets.push({ x: player.x + PLAYER_W / 2, y: player.y, vy: -BULLET_SPEED });
      fireCooldown = 0.32;
    }

    for (const b of bullets) b.y += b.vy * dt;
    bullets = bullets.filter((b) => b.y > -10);
    for (const b of alienBullets) b.y += b.vy * dt;
    alienBullets = alienBullets.filter((b) => b.y < H + 10);

    // Alien step
    alienStepTimer += dt;
    while (alienStepTimer >= stepInterval) {
      alienStepTimer -= stepInterval;
      let leftMost = Infinity, rightMost = -Infinity, lowest = -Infinity;
      let aliveCount = 0;
      for (const a of aliens) {
        if (!a.alive) continue;
        aliveCount++;
        leftMost = Math.min(leftMost, a.x);
        rightMost = Math.max(rightMost, a.x + a.w);
        lowest = Math.max(lowest, a.y + a.h);
      }
      if (aliveCount === 0) break;
      let dx = alienDir * 14;
      let dropDown = false;
      if (rightMost + dx > W - 10 || leftMost + dx < 10) {
        alienDir = -alienDir;
        dx = 0;
        dropDown = true;
      }
      for (const a of aliens) {
        if (!a.alive) continue;
        a.x += dx;
        if (dropDown) a.y += 18;
      }
      // Have a random alien fire
      const alive = aliens.filter((a) => a.alive);
      if (alive.length > 0 && Math.random() < 0.42) {
        const shooter = alive[Math.floor(Math.random() * alive.length)];
        alienBullets.push({ x: shooter.x + shooter.w / 2, y: shooter.y + shooter.h, vy: 280 });
      }
      // Reached the player line?
      if (lowest >= PLAYER_Y) { state = STATE.OVER; return; }
    }

    // Collisions
    for (const b of bullets) {
      for (const a of aliens) {
        if (!a.alive) continue;
        if (b.x > a.x && b.x < a.x + a.w && b.y > a.y && b.y < a.y + a.h) {
          a.alive = false;
          b.dead = true;
          score += 10 * (ALIEN_ROWS - a.row);
          break;
        }
      }
    }
    bullets = bullets.filter((b) => !b.dead);

    for (const ab of alienBullets) {
      if (ab.x > player.x && ab.x < player.x + PLAYER_W && ab.y > player.y && ab.y < player.y + PLAYER_H) {
        ab.dead = true;
        lives--;
        if (lives <= 0) { state = STATE.OVER; return; }
      }
    }
    alienBullets = alienBullets.filter((b) => !b.dead);

    // Wave clear
    if (aliens.every((a) => !a.alive)) { wave++; spawnWave(); }
  }

  function drawAlien(a) {
    const colors = ["#ff5d6c", "#ffae3b", "#7dff5d", "#5db4ff"];
    ctx.fillStyle = colors[a.row % colors.length];
    ctx.fillRect(a.x + 4, a.y + 4, a.w - 8, a.h - 8);
    ctx.fillRect(a.x, a.y + 8, 6, 10);
    ctx.fillRect(a.x + a.w - 6, a.y + 8, 6, 10);
    ctx.fillStyle = "#000";
    ctx.fillRect(a.x + 10, a.y + 10, 4, 4);
    ctx.fillRect(a.x + a.w - 14, a.y + 10, 4, 4);
  }

  function drawPlayer() {
    ctx.fillStyle = "#7df9ff";
    ctx.fillRect(player.x + PLAYER_W / 2 - 4, player.y - 6, 8, 8);
    ctx.fillRect(player.x, player.y, PLAYER_W, PLAYER_H);
  }

  function render() {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, W, H);

    if (state === STATE.TITLE) {
      ctx.textAlign = "center";
      ctx.fillStyle = "#7df9ff";
      ctx.font = "bold 56px sans-serif";
      ctx.fillText("INVADERS", W / 2, H / 2 - 40);
      ctx.fillStyle = "#aab";
      ctx.font = "18px sans-serif";
      ctx.fillText("Arrow keys to move, SPACE to fire", W / 2, H / 2 + 8);
      ctx.fillStyle = "#fff";
      ctx.fillText("Press SPACE to start", W / 2, H / 2 + 40);
      return;
    }

    for (const a of aliens) {
      if (!a.alive) continue;
      drawAlien(a);
    }
    drawPlayer();

    ctx.fillStyle = "#fff";
    for (const b of bullets) ctx.fillRect(b.x - 1, b.y - 8, 2, 8);
    ctx.fillStyle = "#ff5d6c";
    for (const b of alienBullets) ctx.fillRect(b.x - 1, b.y, 2, 8);

    ctx.textAlign = "left";
    ctx.fillStyle = "#fff";
    ctx.font = "16px sans-serif";
    ctx.fillText("Score: " + score, 12, 26);
    ctx.fillText("Wave: " + wave, 12, 46);
    ctx.textAlign = "right";
    ctx.fillText("Lives: " + lives, W - 12, 26);

    if (state === STATE.OVER) {
      ctx.fillStyle = "rgba(0,0,0,0.7)";
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = "center";
      ctx.fillStyle = "#fff";
      ctx.font = "bold 48px sans-serif";
      ctx.fillText("GAME OVER", W / 2, H / 2 - 10);
      ctx.font = "20px sans-serif";
      ctx.fillStyle = "#aab";
      ctx.fillText("Score " + score + " — SPACE to retry", W / 2, H / 2 + 30);
    }
  }

  function gameLoop(t) {
    try {
      const dt = Math.min((t - lastTime) / 1000, 0.05);
      lastTime = t;
      update(dt);
      prevKeys = Object.assign(Object.create(null), keys);
      render();
      requestAnimationFrame(gameLoop);
    } catch (err) {
      try { parent.postMessage({ type: "game-error", message: err && err.message || String(err), stack: err && err.stack }, "*"); } catch (_) {}
    }
  }

  window.addEventListener("keydown", (e) => { keys[e.key.toLowerCase()] = true; });
  window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });

  init();
  requestAnimationFrame((t) => { lastTime = t; gameLoop(t); });
})();
</script>
</body>
</html>
