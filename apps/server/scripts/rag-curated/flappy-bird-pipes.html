<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flappy Pipes</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #4ec0ca; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  canvas { background: #4ec0ca; display: block; }
</style>
</head>
<body>
<canvas id="game" width="500" height="700"></canvas>
<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;

  const STATE = { TITLE: 0, PLAY: 1, OVER: 2 };
  const GRAVITY = 1500;
  const FLAP = -460;
  const PIPE_GAP = 160;
  const PIPE_W = 70;
  const PIPE_INTERVAL = 1.5; // seconds
  const PIPE_SPEED = 200;
  const GROUND_H = 80;

  const keys = Object.create(null);
  let prevKeys = Object.create(null);
  let state = STATE.TITLE;
  let bird, pipes, score, spawnTimer;
  let lastTime = 0;

  function init() {
    bird = { x: 120, y: H / 2, vy: 0, r: 14, rot: 0 };
    pipes = [];
    score = 0;
    spawnTimer = 0;
  }

  function spawnPipe() {
    const margin = 60;
    const top = margin + Math.random() * (H - GROUND_H - margin * 2 - PIPE_GAP);
    pipes.push({ x: W + 20, top, passed: false });
  }

  function pressed(k) {
    return !!keys[k] && !prevKeys[k];
  }

  function update(dt) {
    if (state === STATE.TITLE) {
      if (pressed(" ") || pressed("arrowup")) { init(); state = STATE.PLAY; bird.vy = FLAP; }
      return;
    }
    if (state === STATE.OVER) {
      if (pressed(" ") || pressed("arrowup")) { init(); state = STATE.PLAY; bird.vy = FLAP; }
      return;
    }

    if (pressed(" ") || pressed("arrowup")) bird.vy = FLAP;

    bird.vy += GRAVITY * dt;
    bird.y += bird.vy * dt;
    bird.rot = Math.max(-0.5, Math.min(1.2, bird.vy / 600));

    spawnTimer += dt;
    if (spawnTimer >= PIPE_INTERVAL) {
      spawnTimer -= PIPE_INTERVAL;
      spawnPipe();
    }

    for (const p of pipes) p.x -= PIPE_SPEED * dt;
    pipes = pipes.filter((p) => p.x + PIPE_W > 0);

    // Score and collisions
    for (const p of pipes) {
      if (!p.passed && p.x + PIPE_W < bird.x) { p.passed = true; score++; }
      // Top pipe rect: x..x+PIPE_W, 0..p.top; bottom: x..x+PIPE_W, p.top+PIPE_GAP..H-GROUND_H
      if (
        bird.x + bird.r > p.x &&
        bird.x - bird.r < p.x + PIPE_W &&
        (bird.y - bird.r < p.top || bird.y + bird.r > p.top + PIPE_GAP)
      ) {
        state = STATE.OVER;
      }
    }

    if (bird.y + bird.r >= H - GROUND_H) {
      bird.y = H - GROUND_H - bird.r;
      state = STATE.OVER;
    }
    if (bird.y - bird.r < 0) {
      bird.y = bird.r;
      bird.vy = 0;
    }
  }

  function drawBird() {
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rot);
    ctx.fillStyle = "#ffd23b";
    ctx.beginPath();
    ctx.arc(0, 0, bird.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#ff8a3b";
    ctx.beginPath();
    ctx.moveTo(8, -2);
    ctx.lineTo(20, 0);
    ctx.lineTo(8, 4);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(4, -4, 3.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#000";
    ctx.beginPath();
    ctx.arc(5, -4, 1.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawPipe(p) {
    ctx.fillStyle = "#5cb050";
    ctx.fillRect(p.x, 0, PIPE_W, p.top);
    ctx.fillRect(p.x, p.top + PIPE_GAP, PIPE_W, H - GROUND_H - (p.top + PIPE_GAP));
    // Caps
    ctx.fillStyle = "#3a8a3a";
    ctx.fillRect(p.x - 4, p.top - 18, PIPE_W + 8, 18);
    ctx.fillRect(p.x - 4, p.top + PIPE_GAP, PIPE_W + 8, 18);
  }

  function render() {
    // Sky
    ctx.fillStyle = "#4ec0ca";
    ctx.fillRect(0, 0, W, H);

    // Pipes
    for (const p of pipes) drawPipe(p);

    // Ground
    ctx.fillStyle = "#ded895";
    ctx.fillRect(0, H - GROUND_H, W, GROUND_H);
    ctx.fillStyle = "#a89b3a";
    for (let x = 0; x < W; x += 18) ctx.fillRect(x, H - GROUND_H, 9, 6);

    drawBird();

    if (state === STATE.TITLE) {
      ctx.fillStyle = "rgba(0,0,0,0.35)";
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = "center";
      ctx.fillStyle = "#fff";
      ctx.font = "bold 48px sans-serif";
      ctx.fillText("FLAPPY", W / 2, H / 2 - 30);
      ctx.font = "18px sans-serif";
      ctx.fillText("SPACE to flap", W / 2, H / 2 + 6);
      ctx.fillText("Press SPACE to start", W / 2, H / 2 + 38);
      return;
    }

    // Score
    ctx.textAlign = "center";
    ctx.fillStyle = "#fff";
    ctx.font = "bold 56px sans-serif";
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 4;
    ctx.strokeText(String(score), W / 2, 80);
    ctx.fillText(String(score), W / 2, 80);

    if (state === STATE.OVER) {
      ctx.fillStyle = "rgba(0,0,0,0.6)";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#fff";
      ctx.font = "bold 44px sans-serif";
      ctx.fillText("GAME OVER", W / 2, H / 2 - 20);
      ctx.font = "20px sans-serif";
      ctx.fillText("Score " + score, W / 2, H / 2 + 14);
      ctx.fillText("Press SPACE to retry", W / 2, H / 2 + 44);
    }
  }

  function gameLoop(t) {
    try {
      const dt = Math.min((t - lastTime) / 1000, 0.05);
      lastTime = t;
      update(dt);
      // Snapshot key state for next-frame edge detection
      prevKeys = Object.assign(Object.create(null), keys);
      render();
      requestAnimationFrame(gameLoop);
    } catch (err) {
      try { parent.postMessage({ type: "game-error", message: err && err.message || String(err), stack: err && err.stack }, "*"); } catch (_) {}
    }
  }

  window.addEventListener("keydown", (e) => { keys[e.key.toLowerCase()] = true; });
  window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });

  init();
  requestAnimationFrame((t) => { lastTime = t; gameLoop(t); });
})();
</script>
</body>
</html>
