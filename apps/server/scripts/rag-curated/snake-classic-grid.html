<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0d0f12; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  canvas { background: #0d0f12; display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="game" width="600" height="600"></canvas>
<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;

  const STATE = { TITLE: 0, PLAY: 1, OVER: 2 };
  const CELL = 24;
  const COLS = W / CELL;
  const ROWS = H / CELL;
  const TICK = 0.11; // seconds between snake steps

  const keys = Object.create(null);
  let prevKeys = Object.create(null);
  let state = STATE.TITLE;
  let snake, dir, nextDir, food, score, tickAcc;
  let lastTime = 0;

  function pressed(k) { return !!keys[k] && !prevKeys[k]; }

  function init() {
    const cx = Math.floor(COLS / 2);
    const cy = Math.floor(ROWS / 2);
    snake = [
      { x: cx, y: cy },
      { x: cx - 1, y: cy },
      { x: cx - 2, y: cy },
    ];
    dir = { x: 1, y: 0 };
    nextDir = dir;
    score = 0;
    tickAcc = 0;
    spawnFood();
  }

  function spawnFood() {
    const occupied = new Set(snake.map((s) => s.x + "," + s.y));
    let pos;
    let safety = 200;
    do {
      pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      safety--;
    } while (occupied.has(pos.x + "," + pos.y) && safety > 0);
    food = pos;
  }

  function tryTurn(nx, ny) {
    if (nx === -dir.x && ny === -dir.y) return; // no 180s
    nextDir = { x: nx, y: ny };
  }

  function readInput() {
    if (keys["arrowup"] || keys["w"]) tryTurn(0, -1);
    else if (keys["arrowdown"] || keys["s"]) tryTurn(0, 1);
    else if (keys["arrowleft"] || keys["a"]) tryTurn(-1, 0);
    else if (keys["arrowright"] || keys["d"]) tryTurn(1, 0);
  }

  function step() {
    dir = nextDir;
    const head = snake[0];
    const nx = head.x + dir.x;
    const ny = head.y + dir.y;

    // Wall collision
    if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) {
      state = STATE.OVER;
      return;
    }
    // Self collision
    for (const s of snake) {
      if (s.x === nx && s.y === ny) {
        state = STATE.OVER;
        return;
      }
    }
    snake.unshift({ x: nx, y: ny });
    if (nx === food.x && ny === food.y) {
      score += 10;
      spawnFood();
    } else {
      snake.pop();
    }
  }

  function update(dt) {
    if (state === STATE.TITLE) {
      if (pressed(" ") || pressed("enter")) { init(); state = STATE.PLAY; }
      return;
    }
    if (state === STATE.OVER) {
      if (pressed(" ") || pressed("enter")) { init(); state = STATE.PLAY; }
      return;
    }

    readInput();
    tickAcc += dt;
    while (tickAcc >= TICK) {
      tickAcc -= TICK;
      step();
      if (state === STATE.OVER) break;
    }
  }

  function drawCell(x, y, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2);
  }

  function render() {
    ctx.fillStyle = "#0d0f12";
    ctx.fillRect(0, 0, W, H);

    // Subtle grid
    ctx.strokeStyle = "rgba(255,255,255,0.04)";
    ctx.lineWidth = 1;
    for (let x = 0; x <= COLS; x++) {
      ctx.beginPath();
      ctx.moveTo(x * CELL, 0);
      ctx.lineTo(x * CELL, H);
      ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
      ctx.beginPath();
      ctx.moveTo(0, y * CELL);
      ctx.lineTo(W, y * CELL);
      ctx.stroke();
    }

    if (state === STATE.TITLE) {
      ctx.textAlign = "center";
      ctx.fillStyle = "#fff";
      ctx.font = "bold 56px sans-serif";
      ctx.fillText("SNAKE", W / 2, H / 2 - 40);
      ctx.fillStyle = "#9aa";
      ctx.font = "18px sans-serif";
      ctx.fillText("Arrow keys or WASD to turn", W / 2, H / 2 + 4);
      ctx.fillText("Press SPACE to start", W / 2, H / 2 + 36);
      return;
    }

    // Food
    drawCell(food.x, food.y, "#ff3b5c");

    // Snake
    for (let i = 0; i < snake.length; i++) {
      const s = snake[i];
      drawCell(s.x, s.y, i === 0 ? "#7dff5d" : "#3bcc5d");
    }

    // HUD
    ctx.textAlign = "left";
    ctx.fillStyle = "#fff";
    ctx.font = "16px sans-serif";
    ctx.fillText("Score: " + score, 12, 22);

    if (state === STATE.OVER) {
      ctx.fillStyle = "rgba(0,0,0,0.7)";
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = "center";
      ctx.fillStyle = "#fff";
      ctx.font = "bold 48px sans-serif";
      ctx.fillText("GAME OVER", W / 2, H / 2 - 10);
      ctx.font = "18px sans-serif";
      ctx.fillStyle = "#9aa";
      ctx.fillText("Score " + score + " — press SPACE to retry", W / 2, H / 2 + 26);
    }
  }

  function gameLoop(t) {
    try {
      const dt = Math.min((t - lastTime) / 1000, 0.05);
      lastTime = t;
      update(dt);
      prevKeys = Object.assign(Object.create(null), keys);
      render();
      requestAnimationFrame(gameLoop);
    } catch (err) {
      try { parent.postMessage({ type: "game-error", message: err && err.message || String(err), stack: err && err.stack }, "*"); } catch (_) {}
    }
  }

  window.addEventListener("keydown", (e) => { keys[e.key.toLowerCase()] = true; });
  window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });

  init();
  requestAnimationFrame((t) => { lastTime = t; gameLoop(t); });
})();
</script>
</body>
</html>
