<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Survive</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0e1018; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  canvas { background: #0e1018; display: block; }
</style>
</head>
<body>
<canvas id="game" width="700" height="600"></canvas>
<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;

  const STATE = { TITLE: 0, PLAY: 1, OVER: 2 };
  const PLAYER_R = 12;
  const PLAYER_SPEED = 260;

  const keys = Object.create(null);
  let prevKeys = Object.create(null);
  let state = STATE.TITLE;
  let player, hunters, time, spawnTimer;
  let bestTime = 0;
  let lastTime = 0;

  function pressed(k) { return !!keys[k] && !prevKeys[k]; }

  function init() {
    player = { x: W / 2, y: H / 2 };
    hunters = [];
    time = 0;
    spawnTimer = 0;
  }

  function spawnHunter() {
    const colors = ["#ff5d6c", "#ffae3b", "#3bff7a", "#3bd6ff", "#a23bff"];
    let x, y;
    if (Math.random() < 0.5) { x = Math.random() < 0.5 ? -20 : W + 20; y = Math.random() * H; }
    else { y = Math.random() < 0.5 ? -20 : H + 20; x = Math.random() * W; }
    hunters.push({
      x, y,
      r: 8 + Math.random() * 8,
      speed: 70 + Math.random() * 50,
      color: colors[Math.floor(Math.random() * colors.length)],
    });
  }

  function update(dt) {
    if (state === STATE.TITLE) {
      if (pressed(" ") || pressed("enter")) { init(); state = STATE.PLAY; }
      return;
    }
    if (state === STATE.OVER) {
      if (pressed(" ") || pressed("enter")) { init(); state = STATE.PLAY; }
      return;
    }

    time += dt;

    // Movement
    let mx = 0, my = 0;
    if (keys["w"] || keys["arrowup"]) my -= 1;
    if (keys["s"] || keys["arrowdown"]) my += 1;
    if (keys["a"] || keys["arrowleft"]) mx -= 1;
    if (keys["d"] || keys["arrowright"]) mx += 1;
    const len = Math.hypot(mx, my);
    if (len > 0) { mx /= len; my /= len; }
    player.x += mx * PLAYER_SPEED * dt;
    player.y += my * PLAYER_SPEED * dt;
    player.x = Math.max(PLAYER_R, Math.min(W - PLAYER_R, player.x));
    player.y = Math.max(PLAYER_R, Math.min(H - PLAYER_R, player.y));

    // Spawn
    spawnTimer += dt;
    const interval = Math.max(0.25, 1.0 - time * 0.018);
    while (spawnTimer >= interval) { spawnTimer -= interval; spawnHunter(); }

    // Hunters home in, accelerating with time
    const speedBoost = 1 + time * 0.012;
    for (const h of hunters) {
      const dx = player.x - h.x;
      const dy = player.y - h.y;
      const d = Math.hypot(dx, dy) || 1;
      h.x += (dx / d) * h.speed * speedBoost * dt;
      h.y += (dy / d) * h.speed * speedBoost * dt;
    }

    // Collision (any hunter)
    for (const h of hunters) {
      const dx = h.x - player.x;
      const dy = h.y - player.y;
      if (dx * dx + dy * dy < (h.r + PLAYER_R) * (h.r + PLAYER_R)) {
        if (time > bestTime) bestTime = time;
        state = STATE.OVER;
        return;
      }
    }
  }

  function render() {
    // Background pulse with time
    const pulse = 0.05 + 0.04 * Math.sin(time * 4);
    ctx.fillStyle = "#0e1018";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "rgba(125,229,255," + pulse + ")";
    ctx.fillRect(0, 0, W, H);

    if (state === STATE.TITLE) {
      ctx.textAlign = "center";
      ctx.fillStyle = "#7df9ff";
      ctx.font = "bold 50px sans-serif";
      ctx.fillText("SURVIVE", W / 2, H / 2 - 30);
      ctx.fillStyle = "#aab";
      ctx.font = "18px sans-serif";
      ctx.fillText("WASD or arrows — they get faster the longer you live", W / 2, H / 2 + 4);
      ctx.fillStyle = "#fff";
      ctx.fillText("Press SPACE to start", W / 2, H / 2 + 40);
      if (bestTime > 0) {
        ctx.fillStyle = "#aab";
        ctx.fillText("Best: " + bestTime.toFixed(1) + "s", W / 2, H / 2 + 70);
      }
      return;
    }

    for (const h of hunters) {
      ctx.fillStyle = h.color;
      ctx.shadowColor = h.color;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(h.x, h.y, h.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    ctx.fillStyle = "#fff";
    ctx.shadowColor = "#fff";
    ctx.shadowBlur = 16;
    ctx.beginPath();
    ctx.arc(player.x, player.y, PLAYER_R, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.textAlign = "left";
    ctx.fillStyle = "#fff";
    ctx.font = "bold 22px monospace";
    ctx.fillText(time.toFixed(1) + "s", 16, 32);
    ctx.font = "16px monospace";
    ctx.fillStyle = "#aab";
    ctx.fillText("Best: " + bestTime.toFixed(1) + "s", 16, 54);

    if (state === STATE.OVER) {
      ctx.fillStyle = "rgba(0,0,0,0.7)";
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = "center";
      ctx.fillStyle = "#fff";
      ctx.font = "bold 46px sans-serif";
      ctx.fillText("CAUGHT", W / 2, H / 2 - 20);
      ctx.font = "20px sans-serif";
      ctx.fillStyle = "#aab";
      ctx.fillText("Survived " + time.toFixed(1) + "s", W / 2, H / 2 + 14);
      ctx.fillText("Press SPACE to retry", W / 2, H / 2 + 44);
    }
  }

  function gameLoop(t) {
    try {
      const dt = Math.min((t - lastTime) / 1000, 0.05);
      lastTime = t;
      update(dt);
      prevKeys = Object.assign(Object.create(null), keys);
      render();
      requestAnimationFrame(gameLoop);
    } catch (err) {
      try { parent.postMessage({ type: "game-error", message: err && err.message || String(err), stack: err && err.stack }, "*"); } catch (_) {}
    }
  }

  window.addEventListener("keydown", (e) => { keys[e.key.toLowerCase()] = true; });
  window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });

  init();
  requestAnimationFrame((t) => { lastTime = t; gameLoop(t); });
})();
</script>
</body>
</html>
