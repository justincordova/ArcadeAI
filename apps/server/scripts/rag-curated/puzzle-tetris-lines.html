<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tetris</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0a0d1a; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  canvas { background: #0a0d1a; display: block; }
</style>
</head>
<body>
<canvas id="game" width="500" height="700"></canvas>
<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;

  const STATE = { TITLE: 0, PLAY: 1, OVER: 2 };
  const COLS = 10;
  const ROWS = 20;
  const CELL = 30;
  const BOARD_X = 30;
  const BOARD_Y = 60;
  const COLORS = [null, "#7df9ff", "#ffae3b", "#3bff7a", "#ff5d6c", "#a23bff", "#ffe83b", "#3b6cff"];
  const SHAPES = [
    [],
    [[1, 1, 1, 1]],                    // I
    [[2, 0, 0], [2, 2, 2]],            // L
    [[0, 0, 3], [3, 3, 3]],            // J  (note: actually J vs L flipped — fine)
    [[4, 4], [4, 4]],                  // O
    [[0, 5, 5], [5, 5, 0]],            // S
    [[6, 6, 0], [0, 6, 6]],            // Z
    [[0, 7, 0], [7, 7, 7]],            // T
  ];

  const keys = Object.create(null);
  let prevKeys = Object.create(null);
  let state = STATE.TITLE;
  let board, current, nextPiece, score, lines, level, dropTimer;
  let lastTime = 0;
  // For DAS-ish horizontal repeat
  let leftHeld = 0, rightHeld = 0;

  function makeBoard() {
    const b = [];
    for (let r = 0; r < ROWS; r++) b.push(new Array(COLS).fill(0));
    return b;
  }

  function spawn(typeIndex) {
    const shape = SHAPES[typeIndex].map((row) => row.slice());
    const w = shape[0].length;
    const x = Math.floor((COLS - w) / 2);
    return { shape, x, y: 0, type: typeIndex };
  }

  function randomPiece() { return spawn(1 + Math.floor(Math.random() * 7)); }

  function init() {
    board = makeBoard();
    current = randomPiece();
    nextPiece = randomPiece();
    score = 0;
    lines = 0;
    level = 1;
    dropTimer = 0;
  }

  function dropInterval() { return Math.max(0.08, 0.6 - (level - 1) * 0.06); }

  function collides(piece, ox, oy, shape) {
    const s = shape || piece.shape;
    for (let r = 0; r < s.length; r++) {
      for (let c = 0; c < s[r].length; c++) {
        if (!s[r][c]) continue;
        const x = piece.x + c + ox;
        const y = piece.y + r + oy;
        if (x < 0 || x >= COLS || y >= ROWS) return true;
        if (y >= 0 && board[y][x]) return true;
      }
    }
    return false;
  }

  function rotateMatrix(m) {
    const h = m.length, w = m[0].length;
    const out = [];
    for (let r = 0; r < w; r++) {
      const row = [];
      for (let c = 0; c < h; c++) row.push(m[h - 1 - c][r]);
      out.push(row);
    }
    return out;
  }

  function lockPiece() {
    for (let r = 0; r < current.shape.length; r++) {
      for (let c = 0; c < current.shape[r].length; c++) {
        const v = current.shape[r][c];
        if (!v) continue;
        const y = current.y + r;
        const x = current.x + c;
        if (y < 0) { state = STATE.OVER; return; }
        board[y][x] = v;
      }
    }
    // Clear lines
    let cleared = 0;
    for (let r = ROWS - 1; r >= 0; ) {
      if (board[r].every((v) => v !== 0)) {
        board.splice(r, 1);
        board.unshift(new Array(COLS).fill(0));
        cleared++;
      } else r--;
    }
    if (cleared > 0) {
      const points = [0, 100, 300, 500, 800][cleared] || 800;
      score += points * level;
      lines += cleared;
      level = 1 + Math.floor(lines / 10);
    }
    current = nextPiece;
    nextPiece = randomPiece();
    if (collides(current, 0, 0)) state = STATE.OVER;
  }

  function pressed(k) { return !!keys[k] && !prevKeys[k]; }

  function update(dt) {
    if (state === STATE.TITLE) {
      if (pressed(" ") || pressed("enter")) { init(); state = STATE.PLAY; }
      return;
    }
    if (state === STATE.OVER) {
      if (pressed(" ") || pressed("enter")) { init(); state = STATE.PLAY; }
      return;
    }

    // Move handling — first press fires immediately, then auto-repeats
    // every AUTO_REPEAT_INTERVAL after AUTO_REPEAT_DELAY of being held.
    const AR_DELAY = 0.16;
    const AR_INTERVAL = 0.06;
    const leftDown = !!(keys["arrowleft"] || keys["a"]);
    const rightDown = !!(keys["arrowright"] || keys["d"]);

    if (leftDown) {
      if (leftHeld === 0) {
        if (!collides(current, -1, 0)) current.x -= 1;
        leftHeld = AR_DELAY;
      } else {
        leftHeld -= dt;
        if (leftHeld <= 0) {
          if (!collides(current, -1, 0)) current.x -= 1;
          leftHeld = AR_INTERVAL;
        }
      }
    } else leftHeld = 0;

    if (rightDown) {
      if (rightHeld === 0) {
        if (!collides(current, 1, 0)) current.x += 1;
        rightHeld = AR_DELAY;
      } else {
        rightHeld -= dt;
        if (rightHeld <= 0) {
          if (!collides(current, 1, 0)) current.x += 1;
          rightHeld = AR_INTERVAL;
        }
      }
    } else rightHeld = 0;

    // Rotate (only on press edge)
    if (pressed("arrowup") || pressed("w") || pressed("x")) {
      const rotated = rotateMatrix(current.shape);
      // Wall kick: try offsets 0, -1, +1, -2, +2
      const kicks = [0, -1, 1, -2, 2];
      for (const k of kicks) {
        if (!collides(current, k, 0, rotated)) {
          current.x += k;
          current.shape = rotated;
          break;
        }
      }
    }

    // Hard drop
    if (pressed(" ")) {
      while (!collides(current, 0, 1)) current.y += 1;
      lockPiece();
      dropTimer = 0;
      return;
    }

    // Soft drop
    const drop = (keys["arrowdown"] || keys["s"]) ? dropInterval() / 8 : dropInterval();
    dropTimer += dt;
    while (dropTimer >= drop) {
      dropTimer -= drop;
      if (!collides(current, 0, 1)) current.y += 1;
      else { lockPiece(); break; }
    }
  }

  function drawCell(x, y, color, withinBoard) {
    const px = withinBoard ? BOARD_X + x * CELL : x;
    const py = withinBoard ? BOARD_Y + y * CELL : y;
    ctx.fillStyle = color;
    ctx.fillRect(px + 1, py + 1, CELL - 2, CELL - 2);
    ctx.fillStyle = "rgba(255,255,255,0.2)";
    ctx.fillRect(px + 1, py + 1, CELL - 2, 4);
  }

  function render() {
    ctx.fillStyle = "#0a0d1a";
    ctx.fillRect(0, 0, W, H);

    if (state === STATE.TITLE) {
      ctx.textAlign = "center";
      ctx.fillStyle = "#7df9ff";
      ctx.font = "bold 50px sans-serif";
      ctx.fillText("TETRIS", W / 2, H / 2 - 30);
      ctx.fillStyle = "#aab";
      ctx.font = "16px sans-serif";
      ctx.fillText("Arrows to move, UP to rotate", W / 2, H / 2);
      ctx.fillText("DOWN to soft drop, SPACE to hard drop", W / 2, H / 2 + 22);
      ctx.fillStyle = "#fff";
      ctx.fillText("Press SPACE to start", W / 2, H / 2 + 56);
      return;
    }

    // Board frame
    ctx.fillStyle = "#000";
    ctx.fillRect(BOARD_X - 2, BOARD_Y - 2, COLS * CELL + 4, ROWS * CELL + 4);

    // Locked cells
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const v = board[r][c];
        if (v) drawCell(c, r, COLORS[v], true);
      }
    }
    // Current piece
    for (let r = 0; r < current.shape.length; r++) {
      for (let c = 0; c < current.shape[r].length; c++) {
        const v = current.shape[r][c];
        if (!v) continue;
        const y = current.y + r;
        if (y < 0) continue;
        drawCell(current.x + c, y, COLORS[v], true);
      }
    }

    // HUD
    ctx.textAlign = "left";
    ctx.fillStyle = "#fff";
    ctx.font = "16px sans-serif";
    ctx.fillText("Score", BOARD_X + COLS * CELL + 20, BOARD_Y + 20);
    ctx.font = "bold 20px sans-serif";
    ctx.fillText(String(score), BOARD_X + COLS * CELL + 20, BOARD_Y + 44);
    ctx.font = "16px sans-serif";
    ctx.fillText("Lines: " + lines, BOARD_X + COLS * CELL + 20, BOARD_Y + 80);
    ctx.fillText("Level: " + level, BOARD_X + COLS * CELL + 20, BOARD_Y + 102);

    // Next preview
    ctx.fillText("Next", BOARD_X + COLS * CELL + 20, BOARD_Y + 140);
    const previewX = BOARD_X + COLS * CELL + 20;
    const previewY = BOARD_Y + 150;
    for (let r = 0; r < nextPiece.shape.length; r++) {
      for (let c = 0; c < nextPiece.shape[r].length; c++) {
        const v = nextPiece.shape[r][c];
        if (!v) continue;
        drawCell(previewX + c * CELL, previewY + r * CELL, COLORS[v], false);
      }
    }

    if (state === STATE.OVER) {
      ctx.fillStyle = "rgba(0,0,0,0.7)";
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = "center";
      ctx.fillStyle = "#fff";
      ctx.font = "bold 44px sans-serif";
      ctx.fillText("GAME OVER", W / 2, H / 2 - 10);
      ctx.font = "18px sans-serif";
      ctx.fillStyle = "#aab";
      ctx.fillText("Score " + score + " — SPACE to retry", W / 2, H / 2 + 26);
    }
  }

  function gameLoop(t) {
    try {
      const dt = Math.min((t - lastTime) / 1000, 0.05);
      lastTime = t;
      update(dt);
      prevKeys = Object.assign(Object.create(null), keys);
      render();
      requestAnimationFrame(gameLoop);
    } catch (err) {
      try { parent.postMessage({ type: "game-error", message: err && err.message || String(err), stack: err && err.stack }, "*"); } catch (_) {}
    }
  }

  window.addEventListener("keydown", (e) => { keys[e.key.toLowerCase()] = true; });
  window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });

  init();
  requestAnimationFrame((t) => { lastTime = t; gameLoop(t); });
})();
</script>
</body>
</html>
