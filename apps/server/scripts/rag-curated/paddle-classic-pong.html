<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pong</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0a0a0a; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  canvas { background: #000; display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="game" width="800" height="500"></canvas>
<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;

  const STATE = { TITLE: 0, PLAY: 1, OVER: 2 };
  const WIN_SCORE = 7;
  const PADDLE_W = 12;
  const PADDLE_H = 80;
  const BALL_R = 7;

  const keys = Object.create(null);
  let prevKeys = Object.create(null);
  let state = STATE.TITLE;
  let player, ai, ball, scoreP, scoreA, winner;
  let lastTime = 0;

  function pressed(k) { return !!keys[k] && !prevKeys[k]; }

  function init() {
    player = { x: 30, y: H / 2 - PADDLE_H / 2, vy: 0 };
    ai = { x: W - 30 - PADDLE_W, y: H / 2 - PADDLE_H / 2, vy: 0 };
    scoreP = 0;
    scoreA = 0;
    winner = null;
    resetBall(Math.random() < 0.5 ? -1 : 1);
  }

  function resetBall(dir) {
    ball = {
      x: W / 2,
      y: H / 2,
      vx: 320 * dir,
      vy: (Math.random() * 200 - 100),
      speed: 320,
    };
  }

  function update(dt) {
    if (state === STATE.TITLE) {
      if (pressed(" ") || pressed("enter")) { init(); state = STATE.PLAY; }
      return;
    }
    if (state === STATE.OVER) {
      if (pressed(" ") || pressed("enter")) { init(); state = STATE.PLAY; }
      return;
    }

    // Player paddle
    const speed = 420;
    if (keys["w"] || keys["arrowup"]) player.y -= speed * dt;
    if (keys["s"] || keys["arrowdown"]) player.y += speed * dt;
    player.y = Math.max(0, Math.min(H - PADDLE_H, player.y));

    // AI paddle: moves toward ball but with a small dead zone so it isn't perfect
    const aiCenter = ai.y + PADDLE_H / 2;
    const aiSpeed = 320;
    if (ball.y < aiCenter - 12) ai.y -= aiSpeed * dt;
    else if (ball.y > aiCenter + 12) ai.y += aiSpeed * dt;
    ai.y = Math.max(0, Math.min(H - PADDLE_H, ai.y));

    // Ball
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // Top/bottom walls
    if (ball.y - BALL_R < 0) { ball.y = BALL_R; ball.vy = -ball.vy; }
    if (ball.y + BALL_R > H) { ball.y = H - BALL_R; ball.vy = -ball.vy; }

    // Player paddle collision
    if (
      ball.vx < 0 &&
      ball.x - BALL_R < player.x + PADDLE_W &&
      ball.x - BALL_R > player.x &&
      ball.y > player.y &&
      ball.y < player.y + PADDLE_H
    ) {
      ball.x = player.x + PADDLE_W + BALL_R;
      ball.speed = Math.min(ball.speed * 1.06, 720);
      const offset = (ball.y - (player.y + PADDLE_H / 2)) / (PADDLE_H / 2);
      const angle = offset * (Math.PI / 4);
      ball.vx = Math.cos(angle) * ball.speed;
      ball.vy = Math.sin(angle) * ball.speed;
    }

    // AI paddle collision
    if (
      ball.vx > 0 &&
      ball.x + BALL_R > ai.x &&
      ball.x + BALL_R < ai.x + PADDLE_W &&
      ball.y > ai.y &&
      ball.y < ai.y + PADDLE_H
    ) {
      ball.x = ai.x - BALL_R;
      ball.speed = Math.min(ball.speed * 1.06, 720);
      const offset = (ball.y - (ai.y + PADDLE_H / 2)) / (PADDLE_H / 2);
      const angle = offset * (Math.PI / 4);
      ball.vx = -Math.cos(angle) * ball.speed;
      ball.vy = Math.sin(angle) * ball.speed;
    }

    // Score
    if (ball.x < -BALL_R) { scoreA++; checkWin(); resetBall(1); }
    else if (ball.x > W + BALL_R) { scoreP++; checkWin(); resetBall(-1); }
  }

  function checkWin() {
    if (scoreP >= WIN_SCORE) { winner = "PLAYER"; state = STATE.OVER; }
    else if (scoreA >= WIN_SCORE) { winner = "CPU"; state = STATE.OVER; }
  }

  function render() {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, W, H);

    // Center dashed line
    ctx.strokeStyle = "#333";
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 12]);
    ctx.beginPath();
    ctx.moveTo(W / 2, 0);
    ctx.lineTo(W / 2, H);
    ctx.stroke();
    ctx.setLineDash([]);

    if (state === STATE.TITLE) {
      ctx.fillStyle = "#fff";
      ctx.textAlign = "center";
      ctx.font = "bold 48px sans-serif";
      ctx.fillText("PONG", W / 2, H / 2 - 60);
      ctx.font = "18px sans-serif";
      ctx.fillStyle = "#aaa";
      ctx.fillText("W / S to move — first to " + WIN_SCORE, W / 2, H / 2);
      ctx.fillText("Press SPACE to start", W / 2, H / 2 + 40);
      return;
    }

    // Score
    ctx.fillStyle = "#fff";
    ctx.font = "bold 56px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(String(scoreP), W * 0.25, 70);
    ctx.fillText(String(scoreA), W * 0.75, 70);

    // Paddles
    ctx.fillStyle = "#fff";
    ctx.fillRect(player.x, player.y, PADDLE_W, PADDLE_H);
    ctx.fillRect(ai.x, ai.y, PADDLE_W, PADDLE_H);

    // Ball
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
    ctx.fill();

    if (state === STATE.OVER) {
      ctx.fillStyle = "rgba(0,0,0,0.7)";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#fff";
      ctx.font = "bold 48px sans-serif";
      ctx.fillText(winner + " WINS", W / 2, H / 2 - 20);
      ctx.font = "18px sans-serif";
      ctx.fillStyle = "#aaa";
      ctx.fillText("Press SPACE to play again", W / 2, H / 2 + 24);
    }
  }

  function gameLoop(t) {
    try {
      const dt = Math.min((t - lastTime) / 1000, 0.05);
      lastTime = t;
      update(dt);
      prevKeys = Object.assign(Object.create(null), keys);
      render();
      requestAnimationFrame(gameLoop);
    } catch (err) {
      try { parent.postMessage({ type: "game-error", message: err && err.message || String(err), stack: err && err.stack }, "*"); } catch (_) {}
    }
  }

  window.addEventListener("keydown", (e) => { keys[e.key.toLowerCase()] = true; });
  window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });

  init();
  requestAnimationFrame((t) => { lastTime = t; gameLoop(t); });
})();
</script>
</body>
</html>
