<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tower Defense</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #1c2330; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  canvas { background: #1c2330; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;

  const STATE = { TITLE: 0, PLAY: 1, OVER: 2, WIN: 3 };
  const COLS = 16;
  const ROWS = 12;
  const CELL = 40;
  const GRID_X = (W - COLS * CELL) / 2;
  const GRID_Y = 60;
  const TOWER_COST = 50;
  const TOWER_RANGE = 110;
  const TOWER_DAMAGE = 18;
  const TOWER_FIRE_RATE = 1.4; // shots/sec
  const PROJECTILE_SPEED = 380;
  const START_GOLD = 100;
  const START_LIVES = 10;
  const TOTAL_WAVES = 8;

  // Path: a sequence of cells the enemies walk through
  const PATH = [
    { c: 0, r: 5 }, { c: 3, r: 5 }, { c: 3, r: 2 }, { c: 8, r: 2 },
    { c: 8, r: 8 }, { c: 12, r: 8 }, { c: 12, r: 4 }, { c: 15, r: 4 },
  ];

  const keys = Object.create(null);
  let prevKeys = Object.create(null);
  let state = STATE.TITLE;
  let towers, enemies, projectiles, gold, lives, wave, waveSpawnTimer, waveEnemiesLeft, betweenWavesTimer, hoverCell;
  let lastTime = 0;

  function pressed(k) { return !!keys[k] && !prevKeys[k]; }

  function cellCenter(c, r) { return { x: GRID_X + c * CELL + CELL / 2, y: GRID_Y + r * CELL + CELL / 2 }; }

  function isOnPath(c, r) {
    for (let i = 0; i < PATH.length - 1; i++) {
      const a = PATH[i], b = PATH[i + 1];
      const minC = Math.min(a.c, b.c), maxC = Math.max(a.c, b.c);
      const minR = Math.min(a.r, b.r), maxR = Math.max(a.r, b.r);
      if (c >= minC && c <= maxC && r >= minR && r <= maxR) return true;
    }
    return false;
  }

  function init() {
    towers = [];
    enemies = [];
    projectiles = [];
    gold = START_GOLD;
    lives = START_LIVES;
    wave = 0;
    waveSpawnTimer = 0;
    waveEnemiesLeft = 0;
    betweenWavesTimer = 2.0;
    hoverCell = null;
  }

  function startNextWave() {
    wave++;
    waveEnemiesLeft = 6 + wave * 2;
    waveSpawnTimer = 0;
  }

  function spawnEnemy() {
    const start = cellCenter(PATH[0].c, PATH[0].r);
    enemies.push({
      x: start.x,
      y: start.y,
      hp: 30 + wave * 10,
      maxHp: 30 + wave * 10,
      speed: 50 + wave * 4,
      pathIdx: 1,
      reward: 8 + wave,
    });
  }

  function update(dt) {
    if (state === STATE.TITLE) {
      if (pressed(" ") || pressed("enter")) { init(); state = STATE.PLAY; }
      return;
    }
    if (state === STATE.OVER || state === STATE.WIN) {
      if (pressed(" ") || pressed("enter")) { init(); state = STATE.PLAY; }
      return;
    }

    // Wave management
    if (waveEnemiesLeft <= 0 && enemies.length === 0) {
      if (wave >= TOTAL_WAVES) { state = STATE.WIN; return; }
      betweenWavesTimer -= dt;
      if (betweenWavesTimer <= 0) {
        betweenWavesTimer = 2.5;
        startNextWave();
      }
    } else if (waveEnemiesLeft > 0) {
      waveSpawnTimer -= dt;
      if (waveSpawnTimer <= 0) {
        waveSpawnTimer = 0.7 - Math.min(0.4, wave * 0.04);
        spawnEnemy();
        waveEnemiesLeft--;
      }
    }

    // Enemies move along path
    for (const e of enemies) {
      if (e.pathIdx >= PATH.length) continue;
      const tgt = cellCenter(PATH[e.pathIdx].c, PATH[e.pathIdx].r);
      const dx = tgt.x - e.x;
      const dy = tgt.y - e.y;
      const d = Math.hypot(dx, dy) || 1;
      const step = e.speed * dt;
      if (step >= d) {
        e.x = tgt.x;
        e.y = tgt.y;
        e.pathIdx++;
      } else {
        e.x += (dx / d) * step;
        e.y += (dy / d) * step;
      }
    }
    // Enemies that reach the end take a life
    for (const e of enemies) {
      if (e.pathIdx >= PATH.length) {
        lives--;
        e.dead = true;
      }
    }
    enemies = enemies.filter((e) => !e.dead);
    if (lives <= 0) { state = STATE.OVER; return; }

    // Towers fire
    for (const t of towers) {
      t.cd -= dt;
      if (t.cd > 0) continue;
      // Find nearest enemy in range
      let bestE = null, bestD = Infinity;
      for (const e of enemies) {
        const dx = e.x - t.x;
        const dy = e.y - t.y;
        const d2 = dx * dx + dy * dy;
        if (d2 < TOWER_RANGE * TOWER_RANGE && d2 < bestD) { bestD = d2; bestE = e; }
      }
      if (bestE) {
        const dx = bestE.x - t.x;
        const dy = bestE.y - t.y;
        const d = Math.hypot(dx, dy);
        projectiles.push({
          x: t.x, y: t.y,
          vx: (dx / d) * PROJECTILE_SPEED,
          vy: (dy / d) * PROJECTILE_SPEED,
          target: bestE,
          life: 1.5,
        });
        t.cd = 1 / TOWER_FIRE_RATE;
      }
    }

    // Projectiles
    for (const p of projectiles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      // Hit detection
      for (const e of enemies) {
        const dx = e.x - p.x;
        const dy = e.y - p.y;
        if (dx * dx + dy * dy < 14 * 14) {
          e.hp -= TOWER_DAMAGE;
          p.dead = true;
          if (e.hp <= 0) {
            e.dead = true;
            gold += e.reward;
          }
          break;
        }
      }
    }
    projectiles = projectiles.filter((p) => !p.dead && p.life > 0);
    enemies = enemies.filter((e) => !e.dead);
  }

  function render() {
    ctx.fillStyle = "#1c2330";
    ctx.fillRect(0, 0, W, H);

    if (state === STATE.TITLE) {
      ctx.textAlign = "center";
      ctx.fillStyle = "#fff";
      ctx.font = "bold 50px sans-serif";
      ctx.fillText("TOWER DEFENSE", W / 2, H / 2 - 30);
      ctx.fillStyle = "#aab";
      ctx.font = "18px sans-serif";
      ctx.fillText("Click empty cells to build towers (50g)", W / 2, H / 2);
      ctx.fillText("Survive " + TOTAL_WAVES + " waves", W / 2, H / 2 + 26);
      ctx.fillStyle = "#fff";
      ctx.fillText("Press SPACE to start", W / 2, H / 2 + 60);
      return;
    }

    // Grid background
    ctx.fillStyle = "#2a3142";
    ctx.fillRect(GRID_X, GRID_Y, COLS * CELL, ROWS * CELL);

    // Grid lines
    ctx.strokeStyle = "rgba(255,255,255,0.05)";
    for (let c = 0; c <= COLS; c++) {
      ctx.beginPath();
      ctx.moveTo(GRID_X + c * CELL, GRID_Y);
      ctx.lineTo(GRID_X + c * CELL, GRID_Y + ROWS * CELL);
      ctx.stroke();
    }
    for (let r = 0; r <= ROWS; r++) {
      ctx.beginPath();
      ctx.moveTo(GRID_X, GRID_Y + r * CELL);
      ctx.lineTo(GRID_X + COLS * CELL, GRID_Y + r * CELL);
      ctx.stroke();
    }

    // Path
    ctx.strokeStyle = "#5a6f3a";
    ctx.lineWidth = CELL * 0.7;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    for (let i = 0; i < PATH.length; i++) {
      const p = cellCenter(PATH[i].c, PATH[i].r);
      if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();
    ctx.lineWidth = 1;

    // Hover cell preview
    if (hoverCell && !isOnPath(hoverCell.c, hoverCell.r) && !towers.find((t) => t.cellC === hoverCell.c && t.cellR === hoverCell.r)) {
      const cc = cellCenter(hoverCell.c, hoverCell.r);
      ctx.strokeStyle = gold >= TOWER_COST ? "rgba(125,229,255,0.5)" : "rgba(255,93,108,0.5)";
      ctx.lineWidth = 2;
      ctx.strokeRect(GRID_X + hoverCell.c * CELL + 2, GRID_Y + hoverCell.r * CELL + 2, CELL - 4, CELL - 4);
      ctx.beginPath();
      ctx.arc(cc.x, cc.y, TOWER_RANGE, 0, Math.PI * 2);
      ctx.stroke();
      ctx.lineWidth = 1;
    }

    // Towers
    for (const t of towers) {
      ctx.fillStyle = "#3a4f78";
      ctx.fillRect(t.x - 14, t.y - 14, 28, 28);
      ctx.fillStyle = "#7df9ff";
      ctx.beginPath();
      ctx.arc(t.x, t.y, 8, 0, Math.PI * 2);
      ctx.fill();
    }

    // Enemies
    for (const e of enemies) {
      ctx.fillStyle = "#ff5d6c";
      ctx.beginPath();
      ctx.arc(e.x, e.y, 12, 0, Math.PI * 2);
      ctx.fill();
      // HP bar
      const ratio = Math.max(0, e.hp / e.maxHp);
      ctx.fillStyle = "#222";
      ctx.fillRect(e.x - 14, e.y - 18, 28, 4);
      ctx.fillStyle = "#3bff7a";
      ctx.fillRect(e.x - 14, e.y - 18, 28 * ratio, 4);
    }

    // Projectiles
    ctx.fillStyle = "#ffd23b";
    for (const p of projectiles) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
      ctx.fill();
    }

    // HUD
    ctx.textAlign = "left";
    ctx.fillStyle = "#fff";
    ctx.font = "bold 18px sans-serif";
    ctx.fillText("Gold: " + gold, 16, 30);
    ctx.fillText("Lives: " + lives, 130, 30);
    ctx.textAlign = "right";
    ctx.fillText("Wave " + Math.max(1, wave) + " / " + TOTAL_WAVES, W - 16, 30);

    if (state === STATE.OVER || state === STATE.WIN) {
      ctx.fillStyle = "rgba(0,0,0,0.7)";
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = "center";
      ctx.fillStyle = "#fff";
      ctx.font = "bold 48px sans-serif";
      ctx.fillText(state === STATE.WIN ? "VICTORY" : "DEFEATED", W / 2, H / 2 - 10);
      ctx.font = "20px sans-serif";
      ctx.fillStyle = "#aab";
      ctx.fillText("SPACE to play again", W / 2, H / 2 + 26);
    }
  }

  function pickCell(mx, my) {
    if (mx < GRID_X || my < GRID_Y) return null;
    const c = Math.floor((mx - GRID_X) / CELL);
    const r = Math.floor((my - GRID_Y) / CELL);
    if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return null;
    return { c, r };
  }

  function onClick(e) {
    if (state !== STATE.PLAY) return;
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
    const my = (e.clientY - rect.top) * (canvas.height / rect.height);
    const cell = pickCell(mx, my);
    if (!cell) return;
    if (isOnPath(cell.c, cell.r)) return;
    if (towers.find((t) => t.cellC === cell.c && t.cellR === cell.r)) return;
    if (gold < TOWER_COST) return;
    const center = cellCenter(cell.c, cell.r);
    towers.push({ x: center.x, y: center.y, cellC: cell.c, cellR: cell.r, cd: 0 });
    gold -= TOWER_COST;
  }

  function onMove(e) {
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
    const my = (e.clientY - rect.top) * (canvas.height / rect.height);
    hoverCell = pickCell(mx, my);
  }

  function gameLoop(t) {
    try {
      const dt = Math.min((t - lastTime) / 1000, 0.05);
      lastTime = t;
      update(dt);
      prevKeys = Object.assign(Object.create(null), keys);
      render();
      requestAnimationFrame(gameLoop);
    } catch (err) {
      try { parent.postMessage({ type: "game-error", message: err && err.message || String(err), stack: err && err.stack }, "*"); } catch (_) {}
    }
  }

  window.addEventListener("keydown", (e) => { keys[e.key.toLowerCase()] = true; });
  window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });
  canvas.addEventListener("click", onClick);
  canvas.addEventListener("mousemove", onMove);

  init();
  requestAnimationFrame((t) => { lastTime = t; gameLoop(t); });
})();
</script>
</body>
</html>
