<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Asteroids</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  canvas { background: #000; display: block; }
</style>
</head>
<body>
<canvas id="game" width="800" height="700"></canvas>
<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;

  const STATE = { TITLE: 0, PLAY: 1, OVER: 2 };
  const SHIP_R = 14;
  const ROT_SPEED = 3.4;
  const THRUST = 320;
  const FRICTION = 0.992;
  const BULLET_SPEED = 460;
  const BULLET_LIFE = 1.0;
  const SHOT_COOLDOWN = 0.22;

  const keys = Object.create(null);
  let prevKeys = Object.create(null);
  let state = STATE.TITLE;
  let ship, asteroids, bullets, score, lives, wave, fireCooldown;
  let lastTime = 0;

  function init() {
    ship = { x: W / 2, y: H / 2, vx: 0, vy: 0, angle: -Math.PI / 2, thrust: false };
    bullets = [];
    score = 0;
    lives = 3;
    wave = 1;
    fireCooldown = 0;
    spawnWave();
  }

  function spawnWave() {
    asteroids = [];
    const count = 4 + wave;
    for (let i = 0; i < count; i++) {
      // Spawn at edges, away from ship
      let x, y;
      if (Math.random() < 0.5) { x = Math.random() < 0.5 ? 30 : W - 30; y = Math.random() * H; }
      else { y = Math.random() < 0.5 ? 30 : H - 30; x = Math.random() * W; }
      asteroids.push(makeAsteroid(x, y, 3));
    }
  }

  function makeAsteroid(x, y, size) {
    const baseR = { 1: 14, 2: 24, 3: 40 }[size];
    const speed = 30 + Math.random() * 40 + (3 - size) * 30;
    const ang = Math.random() * Math.PI * 2;
    return {
      x, y,
      vx: Math.cos(ang) * speed,
      vy: Math.sin(ang) * speed,
      r: baseR,
      size,
      seed: Math.random() * 1000,
    };
  }

  function pressed(k) { return !!keys[k] && !prevKeys[k]; }

  function wrap(o, r) {
    if (o.x < -r) o.x += W + r * 2;
    else if (o.x > W + r) o.x -= W + r * 2;
    if (o.y < -r) o.y += H + r * 2;
    else if (o.y > H + r) o.y -= H + r * 2;
  }

  function update(dt) {
    if (state === STATE.TITLE) {
      if (pressed(" ") || pressed("enter")) { init(); state = STATE.PLAY; }
      return;
    }
    if (state === STATE.OVER) {
      if (pressed(" ") || pressed("enter")) { init(); state = STATE.PLAY; }
      return;
    }

    if (keys["arrowleft"] || keys["a"]) ship.angle -= ROT_SPEED * dt;
    if (keys["arrowright"] || keys["d"]) ship.angle += ROT_SPEED * dt;

    ship.thrust = !!(keys["arrowup"] || keys["w"]);
    if (ship.thrust) {
      ship.vx += Math.cos(ship.angle) * THRUST * dt;
      ship.vy += Math.sin(ship.angle) * THRUST * dt;
    }
    ship.vx *= FRICTION;
    ship.vy *= FRICTION;
    ship.x += ship.vx * dt;
    ship.y += ship.vy * dt;
    wrap(ship, SHIP_R);

    fireCooldown -= dt;
    if ((keys[" "]) && fireCooldown <= 0) {
      bullets.push({
        x: ship.x + Math.cos(ship.angle) * SHIP_R,
        y: ship.y + Math.sin(ship.angle) * SHIP_R,
        vx: Math.cos(ship.angle) * BULLET_SPEED + ship.vx,
        vy: Math.sin(ship.angle) * BULLET_SPEED + ship.vy,
        life: BULLET_LIFE,
      });
      fireCooldown = SHOT_COOLDOWN;
    }

    for (const b of bullets) {
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.life -= dt;
      wrap(b, 4);
    }
    bullets = bullets.filter((b) => b.life > 0);

    for (const a of asteroids) {
      a.x += a.vx * dt;
      a.y += a.vy * dt;
      wrap(a, a.r);
    }

    // Bullet/asteroid
    const newAsteroids = [];
    outer: for (const a of asteroids) {
      for (const b of bullets) {
        if (b.dead) continue;
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        if (dx * dx + dy * dy < a.r * a.r) {
          b.dead = true;
          a.dead = true;
          score += { 1: 100, 2: 50, 3: 20 }[a.size];
          if (a.size > 1) {
            newAsteroids.push(makeAsteroid(a.x, a.y, a.size - 1));
            newAsteroids.push(makeAsteroid(a.x, a.y, a.size - 1));
          }
          continue outer;
        }
      }
    }
    bullets = bullets.filter((b) => !b.dead);
    asteroids = asteroids.filter((a) => !a.dead).concat(newAsteroids);

    // Ship/asteroid
    for (const a of asteroids) {
      const dx = a.x - ship.x;
      const dy = a.y - ship.y;
      if (dx * dx + dy * dy < (a.r + SHIP_R) * (a.r + SHIP_R)) {
        lives--;
        if (lives <= 0) { state = STATE.OVER; return; }
        ship.x = W / 2; ship.y = H / 2; ship.vx = 0; ship.vy = 0;
        break;
      }
    }

    if (asteroids.length === 0) { wave++; spawnWave(); }
  }

  function drawShip() {
    ctx.save();
    ctx.translate(ship.x, ship.y);
    ctx.rotate(ship.angle);
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(SHIP_R, 0);
    ctx.lineTo(-SHIP_R, -SHIP_R * 0.7);
    ctx.lineTo(-SHIP_R * 0.5, 0);
    ctx.lineTo(-SHIP_R, SHIP_R * 0.7);
    ctx.closePath();
    ctx.stroke();
    if (ship.thrust && Math.random() > 0.3) {
      ctx.strokeStyle = "#ffae3b";
      ctx.beginPath();
      ctx.moveTo(-SHIP_R * 0.5, -3);
      ctx.lineTo(-SHIP_R - 6, 0);
      ctx.lineTo(-SHIP_R * 0.5, 3);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawAsteroid(a) {
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.strokeStyle = "#bcd";
    ctx.lineWidth = 2;
    ctx.beginPath();
    const points = 9;
    for (let i = 0; i < points; i++) {
      const ang = (i / points) * Math.PI * 2;
      const radius = a.r * (0.78 + 0.22 * Math.sin(a.seed + i * 1.7));
      const x = Math.cos(ang) * radius;
      const y = Math.sin(ang) * radius;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  }

  function render() {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, W, H);

    if (state === STATE.TITLE) {
      ctx.textAlign = "center";
      ctx.fillStyle = "#fff";
      ctx.font = "bold 56px sans-serif";
      ctx.fillText("ASTEROIDS", W / 2, H / 2 - 40);
      ctx.fillStyle = "#aab";
      ctx.font = "18px sans-serif";
      ctx.fillText("Arrow keys to rotate/thrust, SPACE to fire", W / 2, H / 2 + 8);
      ctx.fillText("Press SPACE to start", W / 2, H / 2 + 40);
      return;
    }

    for (const a of asteroids) drawAsteroid(a);
    drawShip();
    ctx.fillStyle = "#fff";
    for (const b of bullets) ctx.fillRect(b.x - 1.5, b.y - 1.5, 3, 3);

    ctx.textAlign = "left";
    ctx.fillStyle = "#fff";
    ctx.font = "16px sans-serif";
    ctx.fillText("Score: " + score, 12, 26);
    ctx.fillText("Wave: " + wave, 12, 46);
    ctx.textAlign = "right";
    ctx.fillText("Lives: " + lives, W - 12, 26);

    if (state === STATE.OVER) {
      ctx.fillStyle = "rgba(0,0,0,0.7)";
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = "center";
      ctx.fillStyle = "#fff";
      ctx.font = "bold 48px sans-serif";
      ctx.fillText("GAME OVER", W / 2, H / 2 - 10);
      ctx.font = "20px sans-serif";
      ctx.fillStyle = "#aab";
      ctx.fillText("Score " + score + " — SPACE to retry", W / 2, H / 2 + 30);
    }
  }

  function gameLoop(t) {
    try {
      const dt = Math.min((t - lastTime) / 1000, 0.05);
      lastTime = t;
      update(dt);
      prevKeys = Object.assign(Object.create(null), keys);
      render();
      requestAnimationFrame(gameLoop);
    } catch (err) {
      try { parent.postMessage({ type: "game-error", message: err && err.message || String(err), stack: err && err.stack }, "*"); } catch (_) {}
    }
  }

  window.addEventListener("keydown", (e) => { keys[e.key.toLowerCase()] = true; });
  window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });

  init();
  requestAnimationFrame((t) => { lastTime = t; gameLoop(t); });
})();
</script>
</body>
</html>
