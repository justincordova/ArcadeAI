<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>15 Puzzle</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #1a1d28; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  canvas { background: #1a1d28; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="game" width="600" height="700"></canvas>
<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;

  const STATE = { TITLE: 0, PLAY: 1, OVER: 2 };
  const SIZE = 4;
  const TILE = 110;
  const BOARD_X = (W - SIZE * TILE) / 2;
  const BOARD_Y = 100;

  const keys = Object.create(null);
  let prevKeys = Object.create(null);
  let state = STATE.TITLE;
  let board, emptyR, emptyC, moves, time;
  let lastTime = 0;

  function isSolved() {
    for (let i = 0; i < SIZE * SIZE - 1; i++) {
      const r = Math.floor(i / SIZE);
      const c = i % SIZE;
      if (board[r][c] !== i + 1) return false;
    }
    return board[SIZE - 1][SIZE - 1] === 0;
  }

  function init() {
    board = [];
    let n = 1;
    for (let r = 0; r < SIZE; r++) {
      const row = [];
      for (let c = 0; c < SIZE; c++) {
        row.push(n === SIZE * SIZE ? 0 : n);
        n++;
      }
      board.push(row);
    }
    emptyR = SIZE - 1;
    emptyC = SIZE - 1;
    // Shuffle by random valid moves so it's solvable
    let last = -1;
    for (let i = 0; i < 200; i++) {
      const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
      const valid = dirs.filter(([dr, dc]) => {
        const nr = emptyR + dr, nc = emptyC + dc;
        if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE) return false;
        // Avoid undoing the previous move
        if (last >= 0 && dr === -dirs[last][0] && dc === -dirs[last][1]) return false;
        return true;
      });
      const pick = valid[Math.floor(Math.random() * valid.length)];
      const idx = dirs.findIndex(([a, b]) => a === pick[0] && b === pick[1]);
      const [dr, dc] = pick;
      board[emptyR][emptyC] = board[emptyR + dr][emptyC + dc];
      board[emptyR + dr][emptyC + dc] = 0;
      emptyR += dr; emptyC += dc;
      last = idx;
    }
    moves = 0;
    time = 0;
  }

  function trySlide(dr, dc) {
    const nr = emptyR - dr;
    const nc = emptyC - dc;
    if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE) return;
    board[emptyR][emptyC] = board[nr][nc];
    board[nr][nc] = 0;
    emptyR = nr;
    emptyC = nc;
    moves++;
    if (isSolved()) state = STATE.OVER;
  }

  function pressed(k) { return !!keys[k] && !prevKeys[k]; }

  function update(dt) {
    if (state === STATE.TITLE) {
      if (pressed(" ") || pressed("enter")) { init(); state = STATE.PLAY; }
      return;
    }
    if (state === STATE.OVER) {
      if (pressed(" ") || pressed("enter")) { init(); state = STATE.PLAY; }
      return;
    }

    time += dt;
    if (pressed("arrowup") || pressed("w")) trySlide(-1, 0);
    else if (pressed("arrowdown") || pressed("s")) trySlide(1, 0);
    else if (pressed("arrowleft") || pressed("a")) trySlide(0, -1);
    else if (pressed("arrowright") || pressed("d")) trySlide(0, 1);
  }

  function render() {
    ctx.fillStyle = "#1a1d28";
    ctx.fillRect(0, 0, W, H);

    if (state === STATE.TITLE) {
      ctx.textAlign = "center";
      ctx.fillStyle = "#fff";
      ctx.font = "bold 50px sans-serif";
      ctx.fillText("15 PUZZLE", W / 2, H / 2 - 30);
      ctx.fillStyle = "#aab";
      ctx.font = "18px sans-serif";
      ctx.fillText("Arrow keys or click to slide tiles", W / 2, H / 2);
      ctx.fillText("Order numbers 1 through 15", W / 2, H / 2 + 26);
      ctx.fillStyle = "#fff";
      ctx.fillText("Press SPACE to start", W / 2, H / 2 + 60);
      return;
    }

    // Board frame
    ctx.fillStyle = "#0e1018";
    ctx.fillRect(BOARD_X - 8, BOARD_Y - 8, SIZE * TILE + 16, SIZE * TILE + 16);

    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const v = board[r][c];
        if (v === 0) continue;
        const x = BOARD_X + c * TILE;
        const y = BOARD_Y + r * TILE;
        const correct = v === r * SIZE + c + 1;
        ctx.fillStyle = correct ? "#3bd6ff" : "#445a8a";
        ctx.fillRect(x + 4, y + 4, TILE - 8, TILE - 8);
        ctx.fillStyle = "#fff";
        ctx.font = "bold 44px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(String(v), x + TILE / 2, y + TILE / 2);
        ctx.textBaseline = "alphabetic";
      }
    }

    ctx.textAlign = "left";
    ctx.fillStyle = "#fff";
    ctx.font = "18px sans-serif";
    ctx.fillText("Moves: " + moves, 18, 40);
    ctx.textAlign = "right";
    ctx.fillText("Time: " + time.toFixed(1) + "s", W - 18, 40);

    if (state === STATE.OVER) {
      ctx.fillStyle = "rgba(0,0,0,0.7)";
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = "center";
      ctx.fillStyle = "#fff";
      ctx.font = "bold 48px sans-serif";
      ctx.fillText("SOLVED!", W / 2, H / 2 - 10);
      ctx.font = "20px sans-serif";
      ctx.fillStyle = "#aab";
      ctx.fillText(moves + " moves in " + time.toFixed(1) + "s", W / 2, H / 2 + 24);
      ctx.fillText("SPACE to play again", W / 2, H / 2 + 54);
    }
  }

  function onClick(e) {
    if (state !== STATE.PLAY) return;
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
    const my = (e.clientY - rect.top) * (canvas.height / rect.height);
    if (mx < BOARD_X || my < BOARD_Y) return;
    const c = Math.floor((mx - BOARD_X) / TILE);
    const r = Math.floor((my - BOARD_Y) / TILE);
    if (c < 0 || c >= SIZE || r < 0 || r >= SIZE) return;
    if (r === emptyR && Math.abs(c - emptyC) === 1) trySlide(0, c < emptyC ? -1 : 1);
    else if (c === emptyC && Math.abs(r - emptyR) === 1) trySlide(r < emptyR ? -1 : 1, 0);
  }

  function gameLoop(t) {
    try {
      const dt = Math.min((t - lastTime) / 1000, 0.05);
      lastTime = t;
      update(dt);
      prevKeys = Object.assign(Object.create(null), keys);
      render();
      requestAnimationFrame(gameLoop);
    } catch (err) {
      try { parent.postMessage({ type: "game-error", message: err && err.message || String(err), stack: err && err.stack }, "*"); } catch (_) {}
    }
  }

  window.addEventListener("keydown", (e) => { keys[e.key.toLowerCase()] = true; });
  window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });
  canvas.addEventListener("click", onClick);

  init();
  requestAnimationFrame((t) => { lastTime = t; gameLoop(t); });
})();
</script>
</body>
</html>
