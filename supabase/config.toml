project_id = "arcadeai-local"

[api]
enabled = true
# Dedicated project ports prevent collisions with Supabase's default 543xx range.
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
enabled = true
port = 55322
shadow_port = 55320
major_version = 17

[db.pooler]
enabled = true
port = 55329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 55323
api_url = "http://127.0.0.1:55321"

[inbucket]
enabled = true
port = 55324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://localhost:5173", "http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# Local users can sign in immediately; Mailpit remains available for flows that send mail.
enable_confirmations = false
double_confirm_changes = true
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[local_smtp]
enabled = true
port = 55325

[analytics]
enabled = true
port = 55327
